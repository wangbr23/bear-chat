<svg xmlns="http://www.w3.org/2000/svg" width="887" height="1774" viewBox="0 0 887 1774">
  <defs>
    <clipPath id="upperRoom" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="887" height="500"/>
    </clipPath>
    <clipPath id="bearSam" clipPathUnits="userSpaceOnUse">
      <path d="M108 490 C91 481 78 494 82 515 C65 535 57 582 61 650 C64 739 71 802 108 824 C137 842 192 842 223 825 C260 803 270 744 269 662 C268 587 254 544 231 526 C234 503 216 484 195 497 C168 484 134 484 108 490 Z"/>
    </clipPath>
    <clipPath id="bearLeo" clipPathUnits="userSpaceOnUse">
      <path d="M307 479 C321 458 358 459 377 474 C397 464 427 475 428 500 C450 516 459 563 460 637 C462 742 454 806 425 826 C398 844 345 841 322 820 C301 800 298 739 298 684 C279 696 255 682 248 656 C239 620 255 571 282 552 C279 526 288 498 307 479 Z"/>
    </clipPath>
    <clipPath id="bearMaya" clipPathUnits="userSpaceOnUse">
      <path d="M491 500 C470 486 447 502 449 525 C432 551 426 604 431 675 C435 752 444 805 474 823 C505 842 572 840 604 820 C633 800 641 749 640 674 C640 596 626 551 608 529 C611 504 588 488 568 501 C545 490 514 490 491 500 Z"/>
    </clipPath>
    <clipPath id="bearYou" clipPathUnits="userSpaceOnUse">
      <path d="M681 491 C660 480 641 494 642 516 C620 542 615 592 619 668 C622 750 632 809 661 828 C690 847 756 846 785 827 C817 806 825 744 823 660 C821 587 807 543 787 523 C789 499 767 483 748 495 C727 485 701 483 681 491 Z"/>
    </clipPath>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b27f"/>
      <stop offset="1" stop-color="#bd8956"/>
    </linearGradient>
    <radialGradient id="rug" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#fff7de"/>
      <stop offset="1" stop-color="#ead8b3"/>
    </radialGradient>
    <linearGradient id="wallBlend" gradientUnits="userSpaceOnUse" x1="0" y1="305" x2="0" y2="500">
      <stop offset="0" stop-color="#f0dfc6" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#f0dfc6" stop-opacity="0.2"/>
      <stop offset="0.78" stop-color="#f0dfc6" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#f0dfc6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#5b3823" flood-opacity="0.15"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .round { stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="887" height="1774" fill="#f8f7f5"/>

  <!-- Preserve the original navigation and blend its illustrated wall into the larger room. -->
  <rect x="0" y="180" width="887" height="435" fill="#f0dfc6"/>
  <image href="bear-chat-room-mock.png" x="0" y="0" width="887" height="1774" clip-path="url(#upperRoom)"/>
  <rect x="0" y="305" width="887" height="195" fill="url(#wallBlend)"/>
  <rect x="743" y="92" width="126" height="80" rx="40" fill="#ffffff" stroke="#e8e5e0"/>
  <circle cx="805" cy="132" r="4" fill="#2d78e7"/>
  <circle cx="817" cy="132" r="4" fill="#2d78e7"/>
  <circle cx="829" cy="132" r="4" fill="#2d78e7"/>

  <!-- Extend the room into a larger Club Penguin-style walkable floor. -->
  <rect x="0" y="603" width="887" height="12" fill="#9c7049"/>
  <rect x="0" y="615" width="887" height="600" fill="url(#floor)"/>
  <g stroke="#9d6e45" stroke-width="3" opacity="0.3">
    <path d="M0 682h887M0 765h887M0 858h887M0 964h887M0 1082h887M0 1199h887"/>
    <path d="M72 615L8 1215M214 615l-49 600M354 615l-21 600M495 615l18 600M638 615l52 600M780 615l89 600"/>
  </g>
  <ellipse cx="451" cy="950" rx="347" ry="251" fill="url(#rug)" stroke="#d3bd93" stroke-width="5"/>
  <path d="M176 951c85-81 178-119 279-114 103 6 195 48 276 126" fill="none" stroke="#e3cea6" stroke-width="9" opacity="0.75"/>
  <path d="M185 1021c84 67 173 100 268 99 100-1 190-38 270-110" fill="none" stroke="#e3cea6" stroke-width="9" opacity="0.75"/>

  <!-- Room furniture creates walkable depth without competing with the bears. -->
  <g filter="url(#softShadow)">
    <ellipse cx="91" cy="1107" rx="125" ry="46" fill="#9c6b43"/>
    <ellipse cx="91" cy="1091" rx="128" ry="49" fill="#b77d4d"/>
    <rect x="22" y="1092" width="16" height="123" rx="8" fill="#835737"/>
    <rect x="146" y="1092" width="16" height="123" rx="8" fill="#835737"/>
    <rect x="73" y="1041" width="54" height="58" rx="8" fill="#f5efe6"/>
    <path d="M127 1052c27-2 29 35 4 38" fill="none" stroke="#f5efe6" stroke-width="10"/>
  </g>
  <g opacity="0.7">
    <ellipse cx="828" cy="574" rx="25" ry="63" fill="#789260" transform="rotate(23 828 574)"/>
    <ellipse cx="789" cy="586" rx="23" ry="72" fill="#8ca274" transform="rotate(-26 789 586)"/>
    <ellipse cx="855" cy="620" rx="22" ry="68" fill="#617c50" transform="rotate(10 855 620)"/>
    <rect x="790" y="638" width="70" height="77" rx="8" fill="#e7ddc9"/>
  </g>

  <g transform="translate(258 477)" filter="url(#softShadow)">
    <rect width="371" height="54" rx="27" fill="#fffdf8" fill-opacity="0.9"/>
    <circle cx="32" cy="27" r="9" fill="none" stroke="#2c6fe5" stroke-width="3"/>
    <circle cx="32" cy="27" r="3" fill="#2c6fe5"/>
    <text class="ui" x="56" y="36" font-size="23" font-weight="650" fill="#4d463f">Tap anywhere on the rug to move</text>
  </g>

  <!-- Destination cue is visible in a static mock; it fades after movement starts. -->
  <path d="M652 1124 C610 1109 564 1093 507 1075" fill="none" stroke="#2d78e7" stroke-width="6" stroke-dasharray="3 17" stroke-linecap="round" opacity="0.75"/>
  <ellipse cx="476" cy="1067" rx="41" ry="22" fill="#2d78e7" fill-opacity="0.13" stroke="#2d78e7" stroke-width="4"/>
  <ellipse cx="476" cy="1067" rx="14" ry="8" fill="#2d78e7" fill-opacity="0.28"/>

  <!-- Reuse the original bear artwork, spaced across the room at different depths. -->
  <g transform="translate(28 232) scale(.68)">
    <image href="bear-chat-room-mock.png" x="0" y="0" width="887" height="1774" clip-path="url(#bearSam)"/>
  </g>
  <g transform="translate(390 235) scale(.70)">
    <image href="bear-chat-room-mock.png" x="0" y="0" width="887" height="1774" clip-path="url(#bearMaya)"/>
  </g>
  <g transform="translate(30 300) scale(.85)">
    <image href="bear-chat-room-mock.png" x="0" y="0" width="887" height="1774" clip-path="url(#bearLeo)"/>
  </g>
  <g transform="translate(-80 320)">
    <image href="bear-chat-room-mock.png" x="0" y="0" width="887" height="1774" clip-path="url(#bearYou)"/>
  </g>

  <!-- Names follow the avatars, like Club Penguin player labels. -->
  <g class="ui" text-anchor="middle" font-size="19" font-weight="650">
    <g transform="translate(140 817)"><rect x="-42" y="-25" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.88"/><text y="-2" fill="#4f4a44">Sam</text></g>
    <g transform="translate(768 822)"><rect x="-45" y="-25" width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.88"/><text y="-2" fill="#4f4a44">Maya</text></g>
    <g transform="translate(340 1028)"><rect x="-41" y="-25" width="82" height="34" rx="17" fill="#ffffff" fill-opacity="0.9"/><text y="-2" fill="#4f4a44">Leo</text></g>
    <g transform="translate(650 1177)"><rect x="-48" y="-27" width="96" height="38" rx="19" fill="#fff0b5" stroke="#d9bd55"/><text y="-2" fill="#52420c">You</text></g>
  </g>

  <!-- Speech remains attached to a moving bear rather than living only in chat. -->
  <g filter="url(#softShadow)">
    <path d="M440 660h300c25 0 45 20 45 45v31c0 25-20 45-45 45h-90l-30 35 3-35H440c-25 0-45-20-45-45v-31c0-25 20-45 45-45z" fill="#ffffff" stroke="#1d1d1f" stroke-width="4"/>
    <text class="ui" x="590" y="735" text-anchor="middle" font-size="31" font-weight="600" fill="#171717">Movie at 7?</text>
  </g>

  <!-- Compact draggable chat panel leaves most of the screen to the room. -->
  <path d="M0 1262c0-29 23-52 52-52h783c29 0 52 23 52 52v512H0z" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="402" y="1227" width="83" height="8" rx="4" fill="#b7b7bd"/>
  <text class="ui" x="45" y="1281" font-size="27" font-weight="700" fill="#1c1c1e">Chat</text>
  <text class="ui" x="841" y="1281" text-anchor="end" font-size="21" font-weight="600" fill="#2d78e7">View history</text>

  <circle cx="69" cy="1340" r="27" fill="#e9eef5"/>
  <circle cx="69" cy="1340" r="17" fill="#e8dec8" stroke="#493225" stroke-width="3"/>
  <text class="ui" x="110" y="1325" font-size="18" fill="#8e8e93">Maya</text>
  <rect x="103" y="1333" width="165" height="54" rx="27" fill="#e9e9eb"/>
  <text class="ui" x="130" y="1370" font-size="25" fill="#111111">I’m in!</text>

  <text class="ui" x="778" y="1415" text-anchor="end" font-size="18" fill="#8e8e93">You</text>
  <rect x="521" y="1422" width="310" height="58" rx="29" fill="#2d78e7"/>
  <text class="ui" x="552" y="1461" font-size="25" fill="#ffffff">Movie at 7?</text>

  <circle cx="69" cy="1518" r="27" fill="#d5a06f"/>
  <text class="ui" x="110" y="1527" font-size="23" fill="#66666c">Leo waved to Maya</text>
  <circle cx="806" cy="1518" r="24" fill="none" stroke="#2d78e7" stroke-width="4"/>
  <path class="round" d="M800 1507l14 11-14 11z" fill="#2d78e7"/>

  <rect x="34" y="1561" width="819" height="68" rx="34" fill="#ffffff" stroke="#c9c9ce" stroke-width="2"/>
  <text class="ui" x="65" y="1605" font-size="26" fill="#a3a3aa">Message the room</text>
  <circle cx="811" cy="1595" r="27" fill="#2d78e7"/>
  <path class="round" d="M811 1608v-27m-11 10 11-11 11 11" fill="none" stroke="#ffffff" stroke-width="4"/>

  <g filter="url(#softShadow)">
    <rect x="34" y="1651" width="252" height="82" rx="27" fill="#ffffff"/>
    <rect x="318" y="1651" width="252" height="82" rx="27" fill="#ffffff"/>
    <rect x="602" y="1651" width="251" height="82" rx="27" fill="#ffffff"/>
  </g>
  <circle cx="78" cy="1692" r="22" fill="none" stroke="#15235c" stroke-width="4"/>
  <circle cx="70" cy="1686" r="3" fill="#15235c"/><circle cx="86" cy="1686" r="3" fill="#15235c"/>
  <path class="round" d="M68 1698c7 8 15 8 22 0" fill="none" stroke="#15235c" stroke-width="3"/>
  <text class="ui" x="112" y="1701" font-size="24" font-weight="700" fill="#15235c">Emotes</text>

  <path class="round" d="M357 1704c5-28 17-42 31-42 8 0 13 7 12 15 6-13 18-17 26-10 5 4 6 11 3 18 8-8 18-8 24-2 6 6 5 14-1 21" fill="none" stroke="#15235c" stroke-width="4"/>
  <text class="ui" x="463" y="1701" font-size="24" font-weight="700" fill="#15235c">Actions</text>

  <path class="round" d="M642 1688c0-15 20-17 25-4 5-13 25-11 25 4 0 14-25 28-25 28s-25-14-25-28z" fill="none" stroke="#15235c" stroke-width="4"/>
  <text class="ui" x="713" y="1701" font-size="24" font-weight="700" fill="#15235c">React</text>

  <rect x="339" y="1750" width="209" height="9" rx="4.5" fill="#111111"/>
</svg>
