name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "BearChat/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "BearChat/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS build and unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Pick an available iPhone simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available | grep -m1 'iPhone' | cut -d '(' -f1 | xargs)
          echo "Picked simulator: $SIMULATOR"
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"
      - name: Build and run unit tests
        run: xcodebuild -project BearChat/BearChat.xcodeproj -scheme BearChat -destination "platform=iOS Simulator,name=${SIMULATOR}" test
